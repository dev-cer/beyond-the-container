apiVersion: v1
kind: Namespace
metadata:
  name: loadtest
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-flash-sale
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app: k6
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          args: ["run", "-q", "--log-output=none", "-e", "BASE_URL=http://ecommerce-rust-svc.nusamart.svc.cluster.local", "-e", "PROFILE=quick", "-e", "LABEL=mission", "/scripts/flash-sale.js"]
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script
