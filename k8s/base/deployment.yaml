# NusaMart 12.12 "lite": the same image as dev-cer/ecommerce-app, running with the in-memory
# catalog (no DATABASE_URL), so a cluster needs no PostgreSQL, PVC or Jenkins/ArgoCD to serve the shop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-rust
  labels:
    app: ecommerce-rust
spec:
  # replicas is left out on purpose: overlays or the HPA own it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ecommerce-rust
  template:
    metadata:
      labels:
        app: ecommerce-rust
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/dev-cer/ecommerce-app:1-3ac931a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # CPU cost of /api/recommendations: the flash-sale load that drives throttling and the HPA.
            - name: RECO_WORK
              value: "100000"
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 32Mi }
            limits: { cpu: 1000m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
